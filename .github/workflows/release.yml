# Publica el instalable al subir una etiqueta de versión (git tag v1.0.0 && git push origin v1.0.0):
# compila el frontend, empaqueta frontend + API y crea la release de GitHub con finhub-vX.Y.Z.zip adjunto.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # La etiqueta, package.json y la versión de la API deben coincidir
      - name: Comprobar versión
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./frontend/package.json').version")
          API=$(sed -n "s/.*const VERSION = '\(.*\)'.*/\1/p" api/src/Controllers/InstallController.php)
          echo "Etiqueta $TAG · package.json $PKG · API $API"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$API" ]; then
            echo "::error::La versión no coincide: actualiza frontend/package.json e InstallController::VERSION."
            exit 1
          fi

      - name: Comprobar sintaxis PHP
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Compilar y empaquetar
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run release

      - name: Crear zip
        run: |
          cd release
          zip -rq "../finhub-${GITHUB_REF_NAME}.zip" finhub

      - uses: softprops/action-gh-release@v2
        with:
          files: finhub-${{ github.ref_name }}.zip
          generate_release_notes: true
